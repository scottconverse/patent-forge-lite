[workspace]
members = ["crates/pfl-domain", "crates/pfl-storage", "crates/pfl-workflow", "crates/pfl-desktop", "crates/pfl-cli", "crates/pfl-api"]
default-members = ["crates/pfl-domain", "crates/pfl-storage", "crates/pfl-workflow", "crates/pfl-desktop", "crates/pfl-cli", "crates/pfl-api"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
publish = false
# The application is MIT; prompt templates are CC BY-SA 4.0 (LICENSE-PROMPTS). Declared here
# so every crate carries the licence a redistributor needs, rather than only a metadata key.
license = "MIT"

[workspace.dependencies]
pfl-domain = { path = "crates/pfl-domain" }
pfl-storage = { path = "crates/pfl-storage" }
pfl-workflow = { path = "crates/pfl-workflow" }
async-trait = "0.1.92"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v4", "serde"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
rusqlite = { version = "0.41.0", features = ["bundled", "backup"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
unicode-segmentation = "1.12"
axum = "0.8.6"
gpui = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4" }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4", features = ["font-kit", "wayland", "x11"] }

[workspace.metadata.foundation]
gpui-revision = "2f808b3c2de049ecfdbad0fdb26763cebfcaa3b4"
native-targets = ["x86_64-pc-windows-msvc", "aarch64-apple-darwin", "x86_64-unknown-linux-gnu"]
# The application is MIT (see LICENSE, committed in 42fe5e9). Prompt templates are
# CC BY-SA 4.0 (LICENSE-PROMPTS). There is deliberately no "license-status" key: it
# used to say no licence had been selected, contradicting the committed file.
license = "MIT"

[profile.dev]
debug = 0

[profile.test]
debug = 0
