name: Release

# Builds and publishes signed/unsigned platform artifacts.
#   - Windows: installer signed with Azure Trusted Signing (same account, profile
#     and action as the CivicCast release pipeline), then fail-closed verified.
#   - macOS: unsigned .app bundle in a zip.
#   - Linux: unsigned x86_64 tarball.
# Signing secrets are optional to the workflow but required for a Windows asset:
# if AZURE_CLIENT_ID is absent the Windows job is skipped and no installer is
# published, rather than publishing an unsigned one.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish (e.g. v0.1.0)"
        required: true
      replace:
        description: "Overwrite the assets of an existing release. Leave false to protect a published release."
        type: boolean
        default: false

# Read-only by default. The publish job asks for `contents: write`; nothing else has it, so a
# compromised step in a build job cannot rewrite a release.
permissions:
  contents: read

jobs:
  # A tag must never publish code that was not tested: this job is the gate, and every build
  # job depends on it.
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Repository-pinned Rust
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Workspace tests
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Acceptance matrix consistency
        shell: pwsh
        run: ./scripts/acceptance-check.ps1

  preflight:
    runs-on: ubuntu-24.04
    outputs:
      azure: ${{ steps.check.outputs.azure }}
    steps:
      - id: check
        env:
          CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        run: |
          if [ -n "$CLIENT_ID" ]; then
            echo "azure=true" >> "$GITHUB_OUTPUT"
            echo "Azure signing credentials present."
          else
            echo "azure=false" >> "$GITHUB_OUTPUT"
            echo "::warning::AZURE_CLIENT_ID is not set; the Windows installer will not be built or published."
          fi

  linux:
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config libssl-dev \
            libfontconfig1-dev libfreetype6-dev libx11-xcb-dev libxkbcommon-x11-dev \
            libxkbcommon-dev libwayland-dev libvulkan-dev
      - name: Install repository-pinned Rust
        run: rustup show
      - name: Build desktop
        run: cargo build -p pfl-desktop --features native --release --locked
      - name: Package
        run: |
          set -euo pipefail
          name="patent-forge-lite-${{ github.ref_name }}-linux-x64"
          stage="dist/$name"
          mkdir -p "$stage/fonts"
          cp target/release/pfl-desktop "$stage/"
          cp README.md LICENSE LICENSE-PROMPTS LEGAL_NOTICE.md THIRD_PARTY_NOTICES.md "$stage/"
          # Documentation ships; the proof evidence does not. Its files record absolute paths from
          # the machine that produced them, which is not something to publish.
          cp -R docs prompts "$stage/"
          rm -rf "$stage/docs/evidence"
          cp packaging/linux/pfl-desktop.desktop "$stage/"
          cp assets/brand/app-256.png "$stage/patent-forge-lite.png"
          cp -R assets/fonts/. "$stage/fonts/"
          tar -czf "dist/$name.tar.gz" -C dist "$name"
          ( cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256" )
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linux
          path: dist/*.tar.gz*
          if-no-files-found: error

  macos:
    needs: verify
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install repository-pinned Rust
        run: rustup show
      - name: Build desktop
        run: cargo build -p pfl-desktop --features native --release --locked
      - name: Assemble app bundle
        env:
          PFL_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          export PFL_VERSION="${PFL_VERSION#v}"
          bash packaging/macos/bundle.sh
      - name: Package
        run: |
          set -euo pipefail
          name="patent-forge-lite-${{ github.ref_name }}-macos-arm64"
          cd packaging/macos
          ditto -c -k --sequesterRsrc --keepParent "Patent Forge Lite.app" "../../dist/$name.zip"
          cd ../..
          ( cd dist && shasum -a 256 "$name.zip" > "$name.zip.sha256" )
          echo "unsigned build: no Apple Developer ID, no notarization" > "dist/$name.UNSIGNED.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: macos
          path: dist/*.zip*
          if-no-files-found: error

  windows:
    needs: [verify, preflight]
    if: needs.preflight.outputs.azure == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - name: Install repository-pinned Rust
        shell: bash
        run: rustup show
      - name: Build desktop
        run: cargo build -p pfl-desktop --features native --release --locked
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found" }
          # The installer's version and file name come from the tag being released, so a
          # v0.2.1 tag can never publish an installer that calls itself something else: AppVersion is
# checked against the tag before a build is accepted.
          $tag = "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "tag '$tag' is not vMAJOR.MINOR.PATCH" }
          & $iscc "/DAppVersion=$version" packaging\windows\patent-forge-lite.iss
          if ($LASTEXITCODE -ne 0) { throw "installer compile failed" }
      - name: Azure Trusted Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2
        with:
          endpoint: https://wcus.codesigning.azure.net
          signing-account-name: scottconverse-signing
          certificate-profile-name: ScottConversePublic
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          files-folder: dist
          files-folder-filter: exe
      - name: Fail closed unless the signature verifies
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $sig = Get-AuthenticodeSignature $exe.FullName
          $sig | Format-List Status, StatusMessage, SignerCertificate
          if ($sig.Status -ne 'Valid') { throw "installer signature is not Valid: $($sig.Status)" }
          $name = "${{ github.ref_name }}-$($exe.Name)"
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($exe.Name)" | Out-File -Encoding ascii "dist\$name.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: dist/*.exe*
          if-no-files-found: error

  publish:
    # The only job that may write: it creates the release and uploads assets.
    permissions:
      contents: write
    needs: [preflight, linux, macos, windows]
    if: ${{ !cancelled() && needs.linux.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: List assets
        run: ls -lh dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          SIGNED: ${{ needs.preflight.outputs.azure }}
          REPLACE: ${{ inputs.replace }}
        run: |
          set -euo pipefail
          # Notes are versioned. A candidate-draft fallback would label a release with text
          # that says it is not released, so a missing file is a refusal, not a default.
          notes="docs/RELEASE-NOTES-${TAG#v}.md"
          if [ ! -f "$notes" ]; then
            echo "::error::no release notes for $TAG: expected $notes"
            exit 1
          fi
          cp "$notes" release-notes.md
          if [ "${SIGNED}" != "true" ]; then
            {
              echo
              echo "---"
              echo
              echo "**Windows installer withheld.** Azure Trusted Signing credentials were not configured"
              echo "for this run, and an unsigned Windows installer is not published."
            } >> release-notes.md
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A published release is immutable here: without an explicit replace, refuse
            # rather than overwrite the assets and notes of something people may have
            # downloaded. Even with it, the notes are left as they were.
            if [ "${REPLACE:-false}" != "true" ]; then
              echo "::error::release $TAG already exists; re-run with replace=true to overwrite its assets (notes are never rewritten)"
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "PatentForge Lite ${TAG#v}" --notes-file release-notes.md --verify-tag
          fi