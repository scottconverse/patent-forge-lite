name: Manual native feasibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux native dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential clang cmake libfontconfig1-dev libfreetype6-dev libx11-xcb-dev libxkbcommon-x11-dev libxkbcommon-dev libwayland-dev libvulkan-dev libssl-dev pkg-config
      - name: Install repository-pinned Rust
        shell: bash
        run: rustup show
      - name: Native host evidence
        shell: bash
        run: |
          rustc -vV
          cargo --version
          host="$(rustc -vV | awk '/^host:/ {print $2}')"
          test "$host" = "${{ matrix.target }}"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # The native target is a different crate configuration: without these the desktop's
      # own unit tests were never compiled, and one of them had not built for some time.
      - name: Native unit tests
        run: cargo test -p pfl-desktop --features native --lib --locked
      - name: Native clippy
        run: cargo clippy -p pfl-desktop --features native --all-targets --locked -- -D warnings
      - run: cargo build -p pfl-desktop --features native --locked --target ${{ matrix.target }}
      # The acceptance matrix is a document, so it can drift. This makes drift a build
      # failure: counts must match rows, evidence paths must exist, no stale claims.
      - name: Acceptance matrix consistency
        shell: pwsh
        run: ./scripts/acceptance-check.ps1
